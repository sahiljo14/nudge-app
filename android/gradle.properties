org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation to prevent cross-drive path relativization
# errors on Windows (project on D: drive, Pub cache on C: drive).
# Symptom: "caches-jvm/*.tab already registered" for shared_preferences_android.
kotlin.incremental=false
