name: nudge
description: Your deadline brain. Never miss what matters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0
  open_filex: ^4.3.4
  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_timezone: ^3.0.0
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.15.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/dark_mode_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#1A1B2E"
  adaptive_icon_foreground: "assets/logos/dark_mode_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logos/